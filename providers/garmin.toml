# Provider configuration for Garmin Connect (connect.garmin.com)
# Supports MFA — browser stays open while user completes verification

[provider]
name = "garmin"
login_url = "https://sso.garmin.com/portal/sso/en-US/sign-in?clientId=GarminConnect&service=https%3A%2F%2Fconnect.garmin.com%2Fmodern"
# "/app" rather than "/app/home" + "/app/activities": after MFA, Garmin lands on a bare
# https://connect.garmin.com/app/ and only later routes to a sub-page. Matching the
# leaf paths meant a successful login polled to its timeout on the landing page and
# reported "never reached a success URL" while actually authenticated (seen 2026-08-17).
# "/app" subsumes both leaves; no Garmin SSO path contains it.
login_success_patterns = ["/app", "/modern", "/dashboard"]
login_failure_patterns = ["/sso/", "/sign-in", "/verify"]
login_email_selector = '#email, input[name="username"], input[name="email"]'
login_password_selector = '#password, input[name="password"]'
login_button_selector = '#login-btn-signin, button[type="submit"]'
login_error_selector = '.alert-error, [class*="error-message"], [class*="status-error"]'
login_otp_selector = 'input[name="code"], input[name="verificationCode"], input[type="tel"], input[type="number"], input[autocomplete="one-time-code"], input.otp-input, input[id*="erification"], input[id*="code"]'
profile_url = "https://connect.garmin.com/modern/profile"
profile_js_extract = '''
(function() {
    var data = {};
    var name = document.querySelector('[class*="display-name"], [class*="userName"]');
    if (name) data.display_name = name.textContent.trim();
    var avatar = document.querySelector('[class*="profile-image"] img, img[class*="avatar"]');
    if (avatar) data.profile_picture_url = avatar.src;
    return JSON.stringify(data);
})()
'''

[list_page]
url = "https://connect.garmin.com/app/activities"
row_selector = '[class*="ActivityListItem_tabletListItem"]'
link_selector = 'a[href*="/activity/"]'
id_regex = '/\/activity\/(\d+)/'
# Garmin /app/ is a client-rendered React app — read activity rows from the
# capture map (window.__dravrCaptures, installed by the stealth payload)
# instead of DOM scraping. The list endpoint is captured during hydration.
js_extract = '''
(function() {
    // dravr-browser nests captured XHRs under `.byUrl` (with a `.last` pointer);
    // older/explicit-fetch entries sit flat at the top level. Merge both so this
    // extract finds the captured response regardless of capture-map shape.
    var __raw = window.__dravrCaptures || {};
    var captures = {};
    if (__raw.byUrl) { for (var __cu in __raw.byUrl) { captures[__cu] = __raw.byUrl[__cu]; } }
    for (var __ck in __raw) { if (__ck !== "byUrl" && __ck !== "last") { captures[__ck] = __raw[__ck]; } }
    // dravr-browser stores the response body as `chunks: [string,...]` (+ a `done`
    // flag), not `.body`; the explicit-fetch path still writes flat `.body`. Read
    // either shape so this extract works regardless of how the entry was captured.
    function captureBody(e) {
        if (!e) return null;
        if (e.body != null) return e.body;
        if (Array.isArray(e.chunks)) return e.chunks.join("");
        return null;
    }

    // Find the activity-search endpoint(s). Offset pagination stashes one capture
    // per page (each a different `start=` offset), so accumulate rows across EVERY
    // matching activity-list capture rather than taking only the last — otherwise
    // a deep historical scrape keeps just the final page. Downstream Rust dedupes
    // by activity id, so overlap between pages is harmless.
    var rows = [];
    var sawList = false;
    var anyOk = false;
    var lastStatus = null;
    for (var k in captures) {
        if (!/\/activitylist-service\/activities\/search\/activities/.test(k) &&
            !/\/activitylist-service\/.*activities/.test(k)) {
            continue;
        }
        sawList = true;
        var entry = captures[k];
        lastStatus = entry.status;
        if (entry.status !== 200) continue;
        var body = captureBody(entry);
        if (!body) continue;
        var parsed;
        try { parsed = JSON.parse(body); }
        catch (e) { continue; }
        // Garmin returns either an array directly or {activityList: [...]}.
        if (!Array.isArray(parsed) && parsed && Array.isArray(parsed.activityList)) {
            parsed = parsed.activityList;
        }
        if (Array.isArray(parsed)) { rows = rows.concat(parsed); anyOk = true; }
    }

    if (!sawList) {
        // Fall back to listing what we did capture so we can iterate
        return JSON.stringify([{
            __debug: "no activity-list capture",
            seen_urls: Object.keys(captures).slice(0, 30)
        }]);
    }
    if (!anyOk) {
        return JSON.stringify([{
            __debug: "list capture non-2xx or unparseable",
            status: lastStatus
        }]);
    }

    // Garmin emits SQL-style timestamps ("2026-04-27 14:25:46.0") on
    // startTimeLocal/startTimeGMT — convert to RFC3339 so sciotte's parser
    // handles it without provider-specific casing.
    function toRfc3339(s, isGmt) {
        if (!s) return null;
        var rfc = s.replace(" ", "T");
        // strip trailing fractional second if shaped like ".0"
        rfc = rfc.replace(/\.\d+$/, "");
        return isGmt ? rfc + "Z" : rfc;
    }

    // Project to sciotte's expected list-row shape.
    var activities = rows.map(function(r) {
        return {
            id: String(r.activityId != null ? r.activityId : (r.id || "")),
            name: r.activityName || "Untitled",
            type: r.activityType ? (r.activityType.typeKey || r.activityType.parentTypeKey) : null,
            sport_type_detail: r.activityType ? (r.activityType.typeKey || null) : null,
            date: toRfc3339(r.startTimeGMT, true) || toRfc3339(r.startTimeLocal, false),
            distance: r.distance,
            time: r.duration,
            elevation: r.elevationGain,
            avg_hr: r.averageHR,
            max_hr: r.maxHR,
            calories: r.calories,
            cadence: r.averageRunningCadenceInStepsPerMinute || r.averageBikingCadenceInRevPerMinute || null,
            avg_speed: r.averageSpeed,
            max_speed: r.maxSpeed,
            avg_power: r.avgPower || r.averagePower,
            suffer_score: r.aerobicTrainingEffect,
            device: r.deviceId
        };
    });

    return JSON.stringify(activities);
})()
'''

[list_page.pagination]
# Garmin's /app/ React UI moved the activity list behind a GraphQL gateway, so it
# no longer fires the REST `/activitylist-service` XHR the passive capture relied
# on (→ 0 activities). Drive the REST list endpoint directly instead: it is still
# live, same-origin on connect.garmin.com, and the gc-api gateway authenticates by
# session cookie + a `connect-csrf-token` header (read from <meta name="csrf-token">,
# which is server-rendered so it's readable the instant the page loads — no
# hydration race) — NOT a Bearer. `start=` is a 0-based ROW offset (so page_step is
# the page size, not 1), `limit=100` pulls a deep page per fetch, and the JSON
# array response is stashed into window.__dravrCaptures for the js_extract above to
# accumulate + map. Offset paging walks back through history until the `after`
# window is satisfied.
url_template = "https://connect.garmin.com/gc-api/activitylist-service/activities/search/activities?start={page}&limit=100"
first_page = 0
page_step = 100
csrf_header = "connect-csrf-token"
accept = "*/*"

# Fields are unused when js_extract is set, but required by the schema
[list_page.fields]
name = 'a[href*="/activity/"]'
sport_type = '[class*="activityTypeText"]'
date = '[class*="activityDate"]'
time = '[class*="metricValue"]'
distance = '[class*="metricValue"]'
elevation = '[class*="metricValue"]'

[detail_page]
url_template = "https://connect.garmin.com/app/activity/{id}"
# The new /app/ Garmin Connect is a fully client-rendered React app — no
# embedded JSON blobs in script tags. Instead we hit `/activity-service/activity/{id}`
# directly from the authenticated page context via synchronous XHR (same-origin,
# cookies attached automatically). The response IS the raw Garmin DTO shape we
# want, so we expose it under `api_raw` and project a few normalized fields for
# SciotteActivity deserialization.
js_extract = '''
(function() {
    var m = location.pathname.match(/activity\/(\d+)/);
    if (!m) return JSON.stringify({error: "no activity id in url", url: location.href});
    var id = m[1];

    // Discover which API path the page actually fetched while hydrating —
    // Garmin's /app/ redesign moved endpoints around; introspect rather than guess.
    var loadedUrls = (performance.getEntries() || [])
        .filter(function(e) { return e.entryType === "resource"; })
        .map(function(e) { return e.name; })
        .filter(function(u) { return /activity|workout|gateway|connectapi/.test(u); });

    // Garmin Connect /app/ stores its API bearer under localStorage["JetLagToken"]
    // as JSON { access_token, refresh_token, expires_in, ... }. The /gc-api/
    // endpoints reject requests without an Authorization: Bearer header.
    // The stealth payload installs window.__dravrCaptures, which records
    // every /activity-service/, /workout-service/, /gc-api/ response the page
    // fetches during hydration. Sciotte's Rust scraper waits long enough
    // before invoking this script that the captures are already in place —
    // a busy-loop here would block the JS event loop and prevent fetches
    // from resolving in the first place.
    // dravr-browser nests captured XHRs under `.byUrl` (with a `.last` pointer);
    // older/explicit-fetch entries sit flat at the top level. Merge both so this
    // extract finds the captured response regardless of capture-map shape.
    var __raw = window.__dravrCaptures || {};
    var captures = {};
    if (__raw.byUrl) { for (var __cu in __raw.byUrl) { captures[__cu] = __raw.byUrl[__cu]; } }
    for (var __ck in __raw) { if (__ck !== "byUrl" && __ck !== "last") { captures[__ck] = __raw[__ck]; } }
    // dravr-browser stores the response body as `chunks: [string,...]` (+ a `done`
    // flag), not `.body`; the explicit-fetch path still writes flat `.body`. Read
    // either shape so this extract works regardless of how the entry was captured.
    function captureBody(e) {
        if (!e) return null;
        if (e.body != null) return e.body;
        if (Array.isArray(e.chunks)) return e.chunks.join("");
        return null;
    }

    // Garmin's /app/ split the activity detail across multiple endpoints —
    // collect the main one (no path suffix after the ID) plus splits/laps
    // from sibling endpoints.
    var captureKey = null;
    var captureEntry = null;
    var splitsCapture = null;
    var lapsCapture = null;
    var typedSplitsCapture = null;
    var idMarker = "/activity-service/activity/" + id;

    function bodyOk(c) { return c && c.status === 200 && captureBody(c); }

    for (var k in captures) {
        if (k.indexOf(idMarker) < 0) continue;
        var tail = k.substring(k.indexOf(idMarker) + idMarker.length).split("?")[0];
        if (tail === "" || tail === "/") {
            captureKey = k;
            captureEntry = captures[k];
        } else if (tail === "/splits") {
            splitsCapture = captures[k];
        } else if (tail === "/typedSplits") {
            typedSplitsCapture = captures[k];
        } else if (tail === "/laps" || tail === "/lapDTOs") {
            lapsCapture = captures[k];
        }
    }

    if (!captureEntry) {
        return JSON.stringify({
            error: "no main capture for activity " + id,
            seen_urls: Object.keys(captures)
        });
    }
    if (captureEntry.status !== 200) {
        return JSON.stringify({
            error: "main capture non-2xx",
            status: captureEntry.status,
            url: captureKey,
            body: (captureBody(captureEntry) || "").slice(0, 300)
        });
    }

    var api;
    try { api = JSON.parse(captureBody(captureEntry)); }
    catch (e) { return JSON.stringify({error: "parse failed", message: String(e)}); }

    // Fold splits/laps captures into api_raw so the OAuth deserializer sees
    // the full provider DTO surface from a single response.
    if (bodyOk(splitsCapture)) {
        try { api.splits_response = JSON.parse(captureBody(splitsCapture)); } catch (e) {}
    }
    if (bodyOk(typedSplitsCapture)) {
        try { api.typed_splits_response = JSON.parse(captureBody(typedSplitsCapture)); } catch (e) {}
    }
    if (bodyOk(lapsCapture)) {
        try { api.laps_response = JSON.parse(captureBody(lapsCapture)); } catch (e) {}
    }

    // Normalize Garmin camelCase DTOs to Strava-style snake_case so the
    // shared Rust parser (used by sciotte for both Strava + Garmin) can
    // deserialize either provider's output.
    function normalizeLap(l) {
        return {
            distance: l.distance != null ? l.distance : null,
            elapsed_time: l.duration != null ? Math.round(l.duration) : l.elapsed_time,
            moving_time: l.movingDuration != null ? Math.round(l.movingDuration) : l.moving_time,
            total_elevation_gain: l.elevationGain != null ? l.elevationGain : l.total_elevation_gain,
            average_speed: l.averageSpeed != null ? l.averageSpeed : l.average_speed,
            max_speed: l.maxSpeed != null ? l.maxSpeed : l.max_speed,
            average_heartrate: l.averageHR != null ? l.averageHR : (l.averageHeartRate != null ? l.averageHeartRate : l.average_heartrate),
            max_heartrate: l.maxHR != null ? l.maxHR : (l.maxHeartRate != null ? l.maxHeartRate : l.max_heartrate),
            average_cadence: l.averageRunningCadenceInStepsPerMinute != null ? l.averageRunningCadenceInStepsPerMinute : (l.averageCadence != null ? l.averageCadence : l.average_cadence),
            average_watts: l.averagePower != null ? l.averagePower : l.average_watts,
            id: l.lapIndex != null ? l.lapIndex : l.id
        };
    }
    function normalizeSplit(s) {
        return {
            distance: s.distance != null ? s.distance : null,
            elapsed_time: s.duration != null ? Math.round(s.duration) : s.elapsed_time,
            moving_time: s.movingDuration != null ? Math.round(s.movingDuration) : s.moving_time,
            elevation_difference: s.elevationGain != null ? s.elevationGain : s.elevation_difference,
            average_speed: s.averageSpeed != null ? s.averageSpeed : s.average_speed,
            average_heartrate: s.averageHR != null ? s.averageHR : s.average_heartrate
        };
    }

    // /app/ Garmin Connect splits these endpoints out — laps live under
    // `/laps` and contain `lapDTOs`; splits under `/splits` or `/typedSplits`.
    var rawLaps = api.activityLaps || api.lapDTOs || api.laps ||
                  (api.laps_response && (api.laps_response.lapDTOs || api.laps_response.laps)) ||
                  null;
    var rawSplits = api.activitySplits || api.splits ||
                    (api.splits_response && (api.splits_response.splits || api.splits_response.activitySplits)) ||
                    (api.typed_splits_response && api.typed_splits_response.splits) ||
                    null;

    var summary = api.summaryDTO || {};

    // Garmin exposes the start coordinate on the summary DTO. The field
    // name varies across endpoints — `startLatitude`/`startLongitude` is
    // the modern Connect /app/ shape; older /modern/proxy responses used
    // `startLatitudeDecimal`/`startLongitudeDecimal`. Skip [0,0] which
    // Garmin emits for indoor activities recorded without GPS.
    function pickCoord() {
        var lat = summary.startLatitude;
        var lng = summary.startLongitude;
        if (lat == null) lat = summary.startLatitudeDecimal;
        if (lng == null) lng = summary.startLongitudeDecimal;
        if (lat == null || lng == null) return null;
        if (typeof lat !== "number") lat = Number(lat);
        if (typeof lng !== "number") lng = Number(lng);
        if (!isFinite(lat) || !isFinite(lng)) return null;
        if (Math.abs(lat) < 0.0001 && Math.abs(lng) < 0.0001) return null;
        if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
        return { lat: String(lat), lng: String(lng) };
    }

    // ---- Route geometry -------------------------------------------------
    // The map on Garmin's activity page is fed by
    //   /gc-api/activity-service/activity/{id}/details?...&maxPolylineSize=4000
    // which the stealth payload already captures. Two sources of geometry sit
    // in that one response and they are NOT interchangeable:
    //
    //   geoPolylineDTO.polyline  — GPS-valid points only, each carrying a null
    //                              `altitude`, plus a precomputed bounding box.
    //   activityDetailMetrics    — every sample, as flat rows indexed by
    //                              metricDescriptors, carrying directLatitude,
    //                              directLongitude AND directElevation together.
    //
    // We read the metrics array, because elevation there is complete and
    // index-aligned with the coordinates by construction — no cross-array
    // guesswork. Measured on a 6.6 km trail run: 1275 metric rows, 3 without a
    // GPS fix, and geoPolylineDTO.polyline held exactly the remaining 1272. The
    // bounding box is taken from geoPolylineDTO since Garmin already computed it.
    function buildRoute() {
        var detailsUrl = null;
        for (var u in captures) {
            if (u.indexOf("/details") !== -1 && u.indexOf("activity-service") !== -1) { detailsUrl = u; break; }
        }
        if (!detailsUrl) return null;
        var body = captureBody(captures[detailsUrl]);
        if (!body) return null;
        var det;
        try { det = JSON.parse(body); } catch (e) { return null; }

        var idx = {};
        (det.metricDescriptors || []).forEach(function(m) { idx[m.key] = m.metricsIndex; });
        var la = idx.directLatitude, lo = idx.directLongitude;
        var el = idx.directElevation, di = idx.sumDistance;
        if (la == null || lo == null) return null;

        var coords = [], elevs = [], dists = [];
        (det.activityDetailMetrics || []).forEach(function(row) {
            var m = row && row.metrics;
            if (!m) return;
            var lat = m[la], lon = m[lo];
            // A sample without a fix breaks the polyline; drop it from every
            // array at once so the three stay index-aligned.
            if (lat == null || lon == null) return;
            coords.push([lat, lon]);
            elevs.push(el != null && m[el] != null ? m[el] : null);
            dists.push(di != null && m[di] != null ? m[di] : null);
        });
        if (coords.length < 2) return null;

        // A series with any gap is dropped whole: the Rust side keeps a series
        // only when it is exactly as long as `coordinates`, and a padded array
        // would misreport which samples were really measured.
        function complete(a) { return a.every(function(v) { return v != null; }) ? a : null; }

        var geo = det.geoPolylineDTO || {};
        return {
            coordinates: coords,
            altitudes: complete(elevs),
            distances: complete(dists),
            bounds: (geo.minLat != null && geo.maxLat != null && geo.minLon != null && geo.maxLon != null)
                ? { min_latitude: geo.minLat, max_latitude: geo.maxLat, min_longitude: geo.minLon, max_longitude: geo.maxLon }
                : null
        };
    }

    var coord = pickCoord();

    return JSON.stringify({
        // The full unmolested Garmin API response — what `?raw=true` exposes for
        // OAuth deserializer scaffolding work.
        api_raw: api,

        // Pre-normalized arrays preserved for raw consumers
        raw_laps: rawLaps,
        raw_splits: rawSplits,

        // Normalized projection for SciotteActivity deserialization
        name: api.activityName || "Untitled",
        // Real activity start (UTC). Garmin emits SQL-style timestamps
        // ("2026-04-27 14:25:46.0") on startTimeGMT/startTimeLocal — convert to
        // RFC3339 so a single-activity detail fetch carries the true start
        // instead of falling back to the Rust UNIX_EPOCH sentinel. Mirrors the
        // activity-list js_extract's toRfc3339 handling.
        date: (function() {
            function toRfc3339(s, isGmt) {
                if (!s) return null;
                var rfc = String(s).replace(" ", "T").replace(/\.\d+$/, "");
                return isGmt ? rfc + "Z" : rfc;
            }
            return toRfc3339(summary.startTimeGMT, true) || toRfc3339(summary.startTimeLocal, false);
        })(),
        type: api.activityTypeDTO ? api.activityTypeDTO.typeKey : null,
        distance: summary.distance != null ? summary.distance : null,
        moving_time: summary.movingDuration != null ? Math.round(summary.movingDuration) : null,
        elapsed_time: summary.duration != null ? Math.round(summary.duration) : null,
        elevation: summary.elevationGain != null ? summary.elevationGain : null,
        avg_hr: summary.averageHR != null ? summary.averageHR : null,
        max_hr: summary.maxHR != null ? summary.maxHR : null,
        calories: summary.calories != null ? summary.calories : null,
        cadence: summary.averageRunCadence != null ? summary.averageRunCadence : (summary.averageBikeCadence != null ? summary.averageBikeCadence : null),
        avg_speed: summary.averageSpeed != null ? summary.averageSpeed : null,
        max_speed: summary.maxSpeed != null ? summary.maxSpeed : null,
        avg_power: summary.averagePower != null ? summary.averagePower : null,
        device: api.deviceName || (api.metadataDTO ? api.metadataDTO.deviceMetaDataDTO && api.metadataDTO.deviceMetaDataDTO.deviceName : null),
        start_latitude: coord ? coord.lat : null,
        start_longitude: coord ? coord.lng : null,
        laps: Array.isArray(rawLaps) ? rawLaps.map(normalizeLap) : null,
        splits: Array.isArray(rawSplits) ? rawSplits.map(normalizeSplit) : null,
        route: buildRoute()
    });
})()
'''

# Daily health/wellness summary — uses card-based DOM on Garmin Connect
[health_pages.daily_summary]
url_template = "https://connect.garmin.com/app/daily-summary/{date}"
js_extract = '''
(function() {
    var data = {};
    var mainVal = function(card) {
        var el = card.querySelector('[class*="DailySummaryCardMainValue_mainValue"]');
        return el ? el.textContent.trim() : "";
    };
    var dataBlocks = function(card) {
        var labels = card.querySelectorAll('[class*="DailySummaryCardDataBlock_dataLabel"]');
        var values = card.querySelectorAll('[class*="DailySummaryCardDataBlock_dataValue"]');
        var result = [];
        for (var i = 0; i < labels.length; i++) {
            result.push({
                label: labels[i].textContent.trim().toLowerCase(),
                value: values[i] ? values[i].textContent.trim() : ""
            });
        }
        return result;
    };

    // Heart Rate card
    var hrCard = document.querySelector('[class*="HeartRateCardMain_wrapper"]');
    if (hrCard) {
        data.resting_hr = mainVal(hrCard);
        dataBlocks(hrCard).forEach(function(b) {
            if (b.label.includes("haut") || b.label.includes("high")) data.max_hr = b.value;
            else if (b.label.includes("repos") || b.label.includes("rest")) data.avg_hr_7day = b.value;
        });
    }

    // Body Battery card
    var bbCard = document.querySelector('[class*="BodyBatteryCardMain_wrapper"]');
    if (bbCard) data.body_battery = mainVal(bbCard);

    // Stress card
    var stressCard = document.querySelector('[class*="StressCardMain_wrapper"]');
    if (stressCard) data.stress = mainVal(stressCard);

    // Steps card
    var stepsCard = document.querySelector('[class*="StepsCardMain_wrapper"]');
    if (stepsCard) {
        data.steps = mainVal(stepsCard);
        dataBlocks(stepsCard).forEach(function(b) {
            if (b.label.includes("distance")) data.step_distance = b.value;
            else if (b.label.includes("objectif") || b.label.includes("goal")) data.step_goal = b.value;
        });
    }

    // Intensity Minutes card
    var imCard = document.querySelector('[class*="IntensityMinutesCardMain_wrapper"]');
    if (imCard) {
        data.intensity_minutes = mainVal(imCard);
        dataBlocks(imCard).forEach(function(b) {
            if (b.label.includes("objectif") || b.label.includes("goal")) data.intensity_goal = b.value;
        });
    }

    // Training Status card
    var tsCard = document.querySelector('[class*="TrainingStatusCard_wrapper"]');
    if (tsCard) {
        dataBlocks(tsCard).forEach(function(b) {
            if (b.label.includes("vo2") || b.label.includes("v02")) data.vo2_max = b.value;
            else if (b.label.includes("charge") || b.label.includes("load")) data.training_load = b.value;
        });
    }

    return JSON.stringify(data);
})()
'''

# Sleep page — extracts sleep score, duration, and stage breakdown
[health_pages.sleep]
url_template = "https://connect.garmin.com/app/sleep/{date}"
js_extract = '''
(function() {
    var data = {};

    // Sleep score (prominent number on the page)
    var scoreEl = document.querySelector('[class*="sleepScore"], [class*="SleepScore"], [class*="Score"]');
    if (scoreEl) data.sleep_score = scoreEl.textContent.trim();

    // Total sleep duration
    var durationEl = document.querySelector('[class*="sleepDuration"], [class*="totalSleep"], [class*="SleepDuration"]');
    if (durationEl) data.sleep_duration = durationEl.textContent.trim();

    // Sleep stages — look for label/value pairs (French + English)
    var allText = document.body.textContent;
    var deepMatch = allText.match(/(?:profond|deep)\s*[:\-]?\s*(\d+\s*h?\s*\d*\s*min?)/i);
    if (deepMatch) data.sleep_deep = deepMatch[1].trim();
