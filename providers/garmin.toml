# Provider configuration for Garmin Connect (connect.garmin.com)
# Supports MFA — browser stays open while user completes verification

[provider]
name = "garmin"
login_url = "https://sso.garmin.com/portal/sso/en-US/sign-in?clientId=GarminConnect&service=https%3A%2F%2Fconnect.garmin.com%2Fmodern"
login_success_patterns = ["/app/home", "/app/activities", "/modern", "/dashboard"]
login_failure_patterns = ["/sso/", "/sign-in", "/verify"]
login_email_selector = '#email, input[name="username"], input[name="email"]'
login_password_selector = '#password, input[name="password"]'
login_button_selector = '#login-btn-signin, button[type="submit"]'
login_error_selector = '.alert-error, [class*="error-message"], [class*="status-error"]'
login_otp_selector = 'input[name="code"], input[name="verificationCode"], input[type="tel"], input[type="number"], input[autocomplete="one-time-code"], input.otp-input, input[id*="erification"], input[id*="code"]'
profile_url = "https://connect.garmin.com/modern/profile"
profile_js_extract = '''
(function() {
    var data = {};
    var name = document.querySelector('[class*="display-name"], [class*="userName"]');
    if (name) data.display_name = name.textContent.trim();
    var avatar = document.querySelector('[class*="profile-image"] img, img[class*="avatar"]');
    if (avatar) data.profile_picture_url = avatar.src;
    return JSON.stringify(data);
})()
'''

[list_page]
url = "https://connect.garmin.com/modern/activities"
row_selector = '[class*="ActivityListItem_tabletListItem"]'
link_selector = 'a[href*="/activity/"]'
id_regex = '/\/activity\/(\d+)/'
# Custom JS for list extraction — Garmin uses metric label/value pairs, not table columns
js_extract = '''
(function() {
    var items = document.querySelectorAll('[class*="ActivityListItem_tabletListItem"]');
    var activities = [];
    var seen = {};
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var link = item.querySelector('a[href*="/activity/"]');
        if (!link) continue;
        var href = link.getAttribute("href") || "";
        var idMatch = href.match(/\/activity\/(\d+)/);
        if (!idMatch || seen[idMatch[1]]) continue;
        seen[idMatch[1]] = true;

        var a = { id: idMatch[1], name: link.textContent.trim() };

        var typeEl = item.querySelector('[class*="activityTypeText"]');
        a.type = typeEl ? typeEl.textContent.trim() : "";

        var dateEl = item.querySelector('[class*="activityDate__"]');
        var yearEl = item.querySelector('[class*="activityDateYear"]');
        a.date = (dateEl ? dateEl.textContent.trim() : "") + " " + (yearEl ? yearEl.textContent.trim() : "");

        var metrics = item.querySelectorAll('[class*="metricItem"]');
        for (var m = 0; m < metrics.length; m++) {
            var label = metrics[m].querySelector('[class*="Label"]');
            var value = metrics[m].querySelector('[class*="Value"]');
            if (!label || !value) continue;
            var key = label.textContent.trim().toLowerCase();
            var val = value.textContent.trim();

            if (key.includes("distance")) a.distance = val;
            else if (key.includes("dur") || key.includes("time") || key.includes("temps")) a.time = val;
            else if (key.includes("allure") || key.includes("pace")) a.pace = val;
            else if (key.includes("ascension") || key.includes("elevation")) a.elevation = val;
            else if (key.includes("cardiaque") || key.includes("heart")) a.avg_hr = val;
            else if (key.includes("calories")) a.calories = val;
        }

        activities.push(a);
    }
    return JSON.stringify(activities);
})()
'''

# Fields are unused when js_extract is set, but required by the schema
[list_page.fields]
name = 'a[href*="/activity/"]'
sport_type = '[class*="activityTypeText"]'
date = '[class*="activityDate"]'
time = '[class*="metricValue"]'
distance = '[class*="metricValue"]'
elevation = '[class*="metricValue"]'

[detail_page]
url_template = "https://connect.garmin.com/modern/activity/{id}"
js_extract = '''
(function() {
    var data = {};

    // Activity name
    var nameEl = document.querySelector('h1, [class*="activityName"], [class*="activity-name"]');
    if (nameEl) data.name = nameEl.textContent.trim();

    // Activity type
    var typeEl = document.querySelector('[class*="activityType"], [class*="activity-type"]');
    if (typeEl) data.type = typeEl.textContent.trim();

    // Extract all metric key-value pairs from the page
    var metrics = document.querySelectorAll('[class*="metricItem"], [class*="metric-item"], [class*="stat"]');
    metrics.forEach(function(m) {
        var label = m.querySelector('[class*="Label"], [class*="label"]');
        var value = m.querySelector('[class*="Value"], [class*="value"]');
        if (!label || !value) return;
        var key = label.textContent.trim().toLowerCase();
        var val = value.textContent.trim();

        if (key.includes('distance')) data.distance = val;
        else if (key.includes('dur') || key.includes('time') || key.includes('temps')) data.moving_time = val;
        else if (key.includes('allure') || key.includes('pace')) data.pace = val;
        else if (key.includes('ascension') || key.includes('elevation') || key.includes('elev')) data.elevation = val;
        else if (key.includes('fr') || key.includes('heart') || key.includes('cardiaque')) {
            if (key.includes('max')) data.max_hr = val;
            else data.avg_hr = val;
        }
        else if (key.includes('calories')) data.calories = val;
        else if (key.includes('cadence')) data.cadence = val;
        else if (key.includes('vitesse') || key.includes('speed')) {
            if (key.includes('max')) data.max_speed = val;
            else data.avg_speed = val;
        }
        else if (key.includes('puissance') || key.includes('power')) data.avg_power = val;
        else if (key.includes('temp')) data.temperature = val;
    });

    // Device
    var allText = document.body.textContent;
    var devMatch = allText.match(/(?:Garmin|Apple Watch|Wahoo|Polar|Suunto|COROS)[^\n,]*/i);
    if (devMatch) data.device = devMatch[0].trim();

    // Splits + laps — Garmin Connect hydrates its React app from
    // embedded `<script>` bootstrap blocks. The keys vary by page
    // version ("lapDTOs", "activityLaps", "activitySplits", "splits")
    // so we try each known variant per script. Bracket walker handles
    // arrays nested inside larger JSON objects. Parse errors per script
    // are swallowed — the next script may carry the data.
    function extractJsonArrayForKey(haystack, key) {
        var needle = '"' + key + '"';
        var k = haystack.indexOf(needle);
        if (k < 0) return null;
        var bracket = haystack.indexOf('[', k);
        if (bracket < 0) return null;
        var depth = 0;
        var inString = false;
        var escaped = false;
        for (var i = bracket; i < haystack.length; i++) {
            var ch = haystack[i];
            if (escaped) { escaped = false; continue; }
            if (ch === '\\\\') { escaped = true; continue; }
            if (ch === '"') { inString = !inString; continue; }
            if (inString) continue;
            if (ch === '[') depth++;
            else if (ch === ']') { depth--; if (depth === 0) {
                try { return JSON.parse(haystack.substring(bracket, i + 1)); }
                catch (e) { return null; }
            } }
        }
        return null;
    }
    var scripts = document.querySelectorAll('script');
    for (var si = 0; si < scripts.length; si++) {
        var body = scripts[si].textContent || '';
        if (!data.splits) {
            var sp = extractJsonArrayForKey(body, 'activitySplits');
            if (!Array.isArray(sp)) sp = extractJsonArrayForKey(body, 'splits');
            if (Array.isArray(sp) && sp.length > 0) data.splits = sp;
        }
        if (!data.laps) {
            var lp = extractJsonArrayForKey(body, 'lapDTOs');
            if (!Array.isArray(lp)) lp = extractJsonArrayForKey(body, 'activityLaps');
            if (!Array.isArray(lp)) lp = extractJsonArrayForKey(body, 'laps');
            if (Array.isArray(lp) && lp.length > 0) data.laps = lp;
        }
        if (data.splits && data.laps) break;
    }

    // Normalize Garmin field names to Strava-style keys so the Rust
    // parser (shared across providers) can deserialize either.
    // Garmin DTOs use camelCase + different names: duration vs
    // elapsed_time, averageHR vs average_heartrate, etc.
    function normalizeLap(l) {
        return {
            distance: l.distance != null ? l.distance : null,
            elapsed_time: l.duration != null ? Math.round(l.duration) : l.elapsed_time,
            moving_time: l.movingDuration != null ? Math.round(l.movingDuration) : l.moving_time,
            total_elevation_gain: l.elevationGain != null ? l.elevationGain : l.total_elevation_gain,
            average_speed: l.averageSpeed != null ? l.averageSpeed : l.average_speed,
            max_speed: l.maxSpeed != null ? l.maxSpeed : l.max_speed,
            average_heartrate: l.averageHR != null ? l.averageHR : (l.averageHeartRate != null ? l.averageHeartRate : l.average_heartrate),
            max_heartrate: l.maxHR != null ? l.maxHR : (l.maxHeartRate != null ? l.maxHeartRate : l.max_heartrate),
            average_cadence: l.averageRunningCadenceInStepsPerMinute != null ? l.averageRunningCadenceInStepsPerMinute : (l.averageCadence != null ? l.averageCadence : l.average_cadence),
            average_watts: l.averagePower != null ? l.averagePower : l.average_watts,
            id: l.lapIndex != null ? l.lapIndex : l.id
        };
    }
    function normalizeSplit(s) {
        return {
            distance: s.distance != null ? s.distance : null,
            elapsed_time: s.duration != null ? Math.round(s.duration) : s.elapsed_time,
            moving_time: s.movingDuration != null ? Math.round(s.movingDuration) : s.moving_time,
            elevation_difference: s.elevationGain != null ? s.elevationGain : s.elevation_difference,
            average_speed: s.averageSpeed != null ? s.averageSpeed : s.average_speed,
            average_heartrate: s.averageHR != null ? s.averageHR : s.average_heartrate
        };
    }
    if (Array.isArray(data.splits)) data.splits = data.splits.map(normalizeSplit);
    if (Array.isArray(data.laps)) data.laps = data.laps.map(normalizeLap);

    return JSON.stringify(data);
})()
'''

# Daily health/wellness summary — uses card-based DOM on Garmin Connect
[health_pages.daily_summary]
url_template = "https://connect.garmin.com/app/daily-summary/{date}"
js_extract = '''
(function() {
    var data = {};
    var mainVal = function(card) {
        var el = card.querySelector('[class*="DailySummaryCardMainValue_mainValue"]');
        return el ? el.textContent.trim() : "";
    };
    var dataBlocks = function(card) {
        var labels = card.querySelectorAll('[class*="DailySummaryCardDataBlock_dataLabel"]');
        var values = card.querySelectorAll('[class*="DailySummaryCardDataBlock_dataValue"]');
        var result = [];
        for (var i = 0; i < labels.length; i++) {
            result.push({
                label: labels[i].textContent.trim().toLowerCase(),
                value: values[i] ? values[i].textContent.trim() : ""
            });
        }
        return result;
    };

    // Heart Rate card
    var hrCard = document.querySelector('[class*="HeartRateCardMain_wrapper"]');
    if (hrCard) {
        data.resting_hr = mainVal(hrCard);
        dataBlocks(hrCard).forEach(function(b) {
            if (b.label.includes("haut") || b.label.includes("high")) data.max_hr = b.value;
            else if (b.label.includes("repos") || b.label.includes("rest")) data.avg_hr_7day = b.value;
        });
    }

    // Body Battery card
    var bbCard = document.querySelector('[class*="BodyBatteryCardMain_wrapper"]');
    if (bbCard) data.body_battery = mainVal(bbCard);

    // Stress card
    var stressCard = document.querySelector('[class*="StressCardMain_wrapper"]');
    if (stressCard) data.stress = mainVal(stressCard);

    // Steps card
    var stepsCard = document.querySelector('[class*="StepsCardMain_wrapper"]');
    if (stepsCard) {
        data.steps = mainVal(stepsCard);
        dataBlocks(stepsCard).forEach(function(b) {
            if (b.label.includes("distance")) data.step_distance = b.value;
            else if (b.label.includes("objectif") || b.label.includes("goal")) data.step_goal = b.value;
        });
    }

    // Intensity Minutes card
    var imCard = document.querySelector('[class*="IntensityMinutesCardMain_wrapper"]');
    if (imCard) {
        data.intensity_minutes = mainVal(imCard);
        dataBlocks(imCard).forEach(function(b) {
            if (b.label.includes("objectif") || b.label.includes("goal")) data.intensity_goal = b.value;
        });
    }

    // Training Status card
    var tsCard = document.querySelector('[class*="TrainingStatusCard_wrapper"]');
    if (tsCard) {
        dataBlocks(tsCard).forEach(function(b) {
            if (b.label.includes("vo2") || b.label.includes("v02")) data.vo2_max = b.value;
            else if (b.label.includes("charge") || b.label.includes("load")) data.training_load = b.value;
        });
    }

    return JSON.stringify(data);
})()
'''

# Sleep page — extracts sleep score, duration, and stage breakdown
[health_pages.sleep]
url_template = "https://connect.garmin.com/app/sleep/{date}"
js_extract = '''
(function() {
    var data = {};

    // Sleep score (prominent number on the page)
    var scoreEl = document.querySelector('[class*="sleepScore"], [class*="SleepScore"], [class*="Score"]');
    if (scoreEl) data.sleep_score = scoreEl.textContent.trim();

    // Total sleep duration
    var durationEl = document.querySelector('[class*="sleepDuration"], [class*="totalSleep"], [class*="SleepDuration"]');
    if (durationEl) data.sleep_duration = durationEl.textContent.trim();

    // Sleep stages — look for label/value pairs (French + English)
    var allText = document.body.textContent;
    var deepMatch = allText.match(/(?:profond|deep)\s*[:\-]?\s*(\d+\s*h?\s*\d*\s*min?)/i);
    if (deepMatch) data.sleep_deep = deepMatch[1].trim();
    var lightMatch = allText.match(/(?:l.ger|light)\s*[:\-]?\s*(\d+\s*h?\s*\d*\s*min?)/i);
    if (lightMatch) data.sleep_light = lightMatch[1].trim();
    var remMatch = allText.match(/(?:rem|paradoxal)\s*[:\-]?\s*(\d+\s*h?\s*\d*\s*min?)/i);
    if (remMatch) data.sleep_rem = remMatch[1].trim();
    var awakeMatch = allText.match(/(?:.veill.|awake)\s*[:\-]?\s*(\d+\s*h?\s*\d*\s*min?)/i);
    if (awakeMatch) data.sleep_awake = awakeMatch[1].trim();

    return JSON.stringify(data);
})()
'''
