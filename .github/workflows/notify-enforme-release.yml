# ABOUTME: Tells dravr-enforme a sciotte release exists, which starts the downstream chain
# ABOUTME: enforme bumps and releases, and dravr-platform then moves both its pins together
#
# Why enforme and not the platform directly. dravr-enforme scrapes Garmin and Strava
# through this crate, and dravr-platform pins this crate as well as depending on enforme
# — a diamond. The platform hard-fails any build where a dravr-* crate resolves to two
# versions, so a release announced straight to the platform produces a bump that cannot
# merge until enforme has moved too. Announcing to enforme first makes the order the
# dependency graph already requires the order the automation follows.
#
# The integration downstream is gated, not blind: this crate drives a headless browser
# against live providers, so each hop validates on a branch and merges only on green.

name: "Notify Enforme of Release"

# Called by release.yml rather than triggered by `on: release`. The release is
# created by softprops/action-gh-release using the default GITHUB_TOKEN, and
# GitHub does not start workflow runs from events a GITHUB_TOKEN produced — so
# an `on: release` trigger here could never fire, and never did: this workflow
# had zero runs while five releases went out and the platform pin sat on v0.8.0.
# A trigger that cannot fire is worse than no trigger, because it reads like the
# wire is connected.
on:
  workflow_call:
    inputs:
      version:
        description: "Tag to announce"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to announce (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch sciotte-released to dravr-enforme
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version being announced
        id: v
        env:
          GH_TOKEN: ${{ secrets.DRAVR_DISPATCH_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a release tag to announce"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "announcing $VERSION"

      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DRAVR_DISPATCH_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh api -X POST repos/dravr-ai/dravr-enforme/dispatches \
            -f event_type=sciotte-released \
            -F client_payload[version]="$VERSION" \
            -F client_payload[sha]=${GITHUB_SHA}
