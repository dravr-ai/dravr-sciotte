name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --quiet -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    # The real-browser integration tests launch Chrome through dravr-browser.
    # Before 0.1.1 that launch was unbounded on our side — chromiumoxide caps
    # only the wait for the DevTools endpoint (20s) and leaves the websocket
    # connect after it open-ended — and a launch that never returned wedged this
    # single-threaded suite twice at 15 minutes on 2026-09-04. dravr-browser
    # >= 0.1.1 bounds every launch (DRAVR_BROWSER_LAUNCH_TIMEOUT, 30s by
    # default), so a hang can no longer run this job to GitHub's 6-hour cap; the
    # worst case is fourteen launches timing out in sequence, about seven
    # minutes. What this cap now guards against is a cold-cache rebuild under
    # runner contention: a warm run is ~3 min, but a fresh branch that also
    # brings a new dependency version compiled for 15m15s and was killed four
    # times in one day (tronc 0.11.0 twice, 1.0.0 twice) with every other job
    # green. 25 leaves that build its headroom and still fails a real stall
    # well short of the six-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        # automation_canary.rs launches a real headless Chrome via chromiumoxide
        # to assert that future bumps don't reintroduce the bot-detection signals
        # Google's loader rejects on. Without Chrome on the runner the launch
        # hangs, so install it here.
        uses: browser-actions/setup-chrome@latest
      - run: cargo test --workspace -- --test-threads=1


  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh
