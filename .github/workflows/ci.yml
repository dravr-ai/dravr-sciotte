name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --quiet -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    # A flaky Chrome launch in the real-browser integration tests (chromiumoxide's
    # CDP handshake has no per-launch timeout) can wedge the single-threaded suite.
    # Without this bound the job runs to GitHub's 6-hour hard cap before failing; a
    # warm run is ~2 min and a cold-cache rebuild ~10 min, so 15 fails a hang fast
    # while leaving headroom for a legitimate cold build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        # automation_canary.rs launches a real headless Chrome via chromiumoxide
        # to assert that future bumps don't reintroduce the bot-detection signals
        # Google's loader rejects on. Without Chrome on the runner the launch
        # hangs, so install it here.
        uses: browser-actions/setup-chrome@latest
      - run: cargo test --workspace -- --test-threads=1


  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh
