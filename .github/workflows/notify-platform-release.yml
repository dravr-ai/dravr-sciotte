# ABOUTME: Tells dravr-platform a sciotte release exists so its pinned tag stops drifting
# ABOUTME: The platform's sciotte-bump.yml takes it from there — bump, CI gate, merge, deploy
#
# This is one end of the wire; dravr-platform's sciotte-bump.yml is the other. The
# integration it triggers is still gated rather than blind: sciotte drives a headless
# browser against live providers, so the platform validates the bump on a branch and
# merges only on green. What this replaces is the silence — the platform sat on v0.8.0
# for five releases because nothing told it, and production served the image from the
# last day a human remembered to build one.

name: "Notify Platform of Release"

# Called by release.yml rather than triggered by `on: release`. The release is
# created by softprops/action-gh-release using the default GITHUB_TOKEN, and
# GitHub does not start workflow runs from events a GITHUB_TOKEN produced — so
# an `on: release` trigger here could never fire, and never did: this workflow
# had zero runs while five releases went out and the platform pin sat on v0.8.0.
# A trigger that cannot fire is worse than no trigger, because it reads like the
# wire is connected.
on:
  workflow_call:
    inputs:
      version:
        description: "Tag to announce"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to announce (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch sciotte-released to dravr-platform
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version being announced
        id: v
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PLATFORM_DISPATCH_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a release tag to announce"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "announcing $VERSION"

      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PLATFORM_DISPATCH_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh api -X POST repos/dravr-ai/dravr-platform/dispatches \
            -f event_type=sciotte-released \
            -F client_payload[version]="$VERSION" \
            -F client_payload[sha]=${GITHUB_SHA}
