<!DOCTYPE html>
<html>
<head><title>Verify it's you</title></head>
<body>
  <h1>Verify it's you</h1>
  <p>Check your phone</p>
  <p>A notification was sent to your device. Tap the number shown below.</p>
  <div style="font-size: 48px; font-weight: bold; text-align: center; padding: 20px; width: 100px; margin: 20px auto;">
    <span>78</span>
  </div>
  <p>Trying to sign in on another computer?</p>
  <script>
    document.cookie = "strava_session=fake-session-token; path=/";
    document.cookie = "strava_user=test-user; path=/";
    // Simulate user tapping the correct number on their phone. 3s raced the
    // number extraction on CI's slower headless Chrome (the "78" redirected
    // away before it was scraped); 10s leaves ample room to extract the number
    // first while still landing inside the poll-step timeout for the Success leg.
    setTimeout(function() {
      window.location = '/strava/dashboard.html';
    }, 10000);
  </script>
</body>
</html>
